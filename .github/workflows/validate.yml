name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The tests stub Home Assistant; only the config flow needs voluptuous.
      - run: pip install voluptuous pyflakes
      - run: python -m pyflakes custom_components tests
      - run: python -m unittest discover -s tests -v

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # brands: custom integrations are not in the home-assistant/brands repository.
          # description, issues, topics: GitHub repository settings, which forks lack
          # by default; they say nothing about the code.
          ignore: brands description issues topics
